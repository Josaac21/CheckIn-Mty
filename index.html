<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Check-in Camera Crew MTY</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0d0f0d;
      --panel: #17191a;
      --line: #2a2d2e;
      --text: #ececea;
      --muted: #8a8f8c;
      --accent: #e8462a;
      --ok: #3ecf6e;
      --warn: #e8b53a;
      --err: #e8462a;
      --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: var(--sans); height: 100%; overflow: hidden;
    }
    .frame { display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .eyebrow {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
      color: var(--accent); text-transform: uppercase;
    }
    h1 { margin: 4px 0 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    #reader-wrap { position: relative; flex: 1; min-height: 0; background: #000; }
    #reader { width: 100%; height: 100%; }
    #reader video { object-fit: cover; width: 100% !important; height: 100% !important; }
    .viewfinder {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; align-items: center; justify-content: center; z-index: 5;
    }
    .corner { position: absolute; width: 34px; height: 34px; border: 2.5px solid var(--accent); opacity: 0.85; }
    .corner.tl { top: 22%; left: 14%; border-right: none; border-bottom: none; }
    .corner.tr { top: 22%; right: 14%; border-left: none; border-bottom: none; }
    .corner.bl { bottom: 22%; left: 14%; border-right: none; border-top: none; }
    .corner.br { bottom: 22%; right: 14%; border-left: none; border-top: none; }
    #start-screen {
      position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; text-align: center;
      padding: 32px; background: var(--bg);
    }
    #start-screen .icon { font-size: 40px; }
    #start-screen p { color: var(--muted); font-size: 13px; max-width: 260px; line-height: 1.5; margin: 0; }
    #start-btn {
      background: var(--accent); color: #fff; border: none; padding: 14px 28px;
      border-radius: 6px; font-size: 15px; font-weight: 600; font-family: var(--sans);
    }
    #start-btn:active { opacity: 0.85; }
    #start-error { color: var(--err); font-family: var(--mono); font-size: 12px; display: none; max-width: 280px; }
    #status-overlay {
      position: absolute; inset: 0; z-index: 20; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 6px; opacity: 0;
      pointer-events: none; transition: opacity 0.15s ease; text-align: center; padding: 24px;
    }
    #status-overlay.show { opacity: 1; }
    #status-overlay .glyph { font-size: 54px; line-height: 1; font-family: var(--mono); }
    #status-overlay .name { font-size: 20px; font-weight: 600; }
    #status-overlay .sub {
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; opacity: 0.8;
    }
    footer {
      flex-shrink: 0; padding: 12px 18px 16px; border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--mono); font-size: 12px; color: var(--muted);
    }
    #count { color: var(--text); }
    #dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
      display: inline-block; margin-right: 6px; animation: pulse 1.6s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="eyebrow">Camera Crew MTY &middot; Entrada</div>
      <h1>Check-in</h1>
    </header>
    <div id="reader-wrap">
      <div id="reader"></div>
      <div class="viewfinder">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
      <div id="start-screen">
        <div class="icon">📷</div>
        <button id="start-btn">Activar cámara</button>
        <p>El navegador va a pedir permiso de cámara. Toca "Permitir" cuando aparezca.</p>
        <p id="start-error"></p>
      </div>
      <div id="status-overlay">
        <div class="glyph" id="status-glyph"></div>
        <div class="name" id="status-name"></div>
        <div class="sub" id="status-sub"></div>
      </div>
    </div>
    <footer>
      <span><span id="dot"></span>Escaneando</span>
      <span>Registrados esta sesión: <span id="count">0</span></span>
    </footer>
  </div>

  <script>
    // URL de tu Apps Script (la que termina en /exec)
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwRecbbMMSt8SBdSIAGENA-O2x_zn57hi9ckFIseMzkZ9uV-bjP0ClorVhutYv2GucCaA/exec';

    let sessionCount = 0;
    let isPaused = false;

    const overlay = document.getElementById('status-overlay');
    const glyphEl = document.getElementById('status-glyph');
    const nameEl = document.getElementById('status-name');
    const subEl = document.getElementById('status-sub');
    const countEl = document.getElementById('count');
    const dotEl = document.getElementById('dot');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const startError = document.getElementById('start-error');

    const scanner = new Html5Qrcode('reader');

    startBtn.addEventListener('click', async () => {
      startBtn.textContent = 'Abriendo cámara...';
      startError.style.display = 'none';

      try {
        const testStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        testStream.getTracks().forEach(track => track.stop());

        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          onScanSuccess,
          () => {}
        );
        startScreen.style.display = 'none';
      } catch (err) {
        startBtn.textContent = 'Reintentar';
        startError.style.display = 'block';
        startError.textContent = 'No se pudo abrir la cámara: ' + err;
      }
    });

    function onScanSuccess(decodedText) {
      if (isPaused) return;
      isPaused = true;
      dotEl.style.background = 'var(--muted)';

      fetch(APP_URL + '?id=' + encodeURIComponent(decodedText))
        .then(res => res.json())
        .then(handleResult)
        .catch(handleError);
    }

    function handleResult(res) {
      if (res.status === 'ok') {
        sessionCount += 1;
        countEl.textContent = sessionCount;
        showOverlay('✓', res.nombre || '', 'Bienvenido', 'var(--ok)');
      } else if (res.status === 'duplicate') {
        showOverlay('⟳', res.nombre || '', 'Ya estaba registrado', 'var(--warn)');
      } else if (res.status === 'notfound') {
        showOverlay('✕', '', 'QR no reconocido', 'var(--err)');
      } else {
        showOverlay('!', '', res.message || 'Error de conexión', 'var(--err)');
      }
      resumeAfterDelay();
    }

    function handleError(err) {
      showOverlay('!', '', 'Error de conexión, reintenta', 'var(--err)');
      resumeAfterDelay();
    }

    function showOverlay(glyph, name, sub, color) {
      glyphEl.textContent = glyph;
      glyphEl.style.color = color;
      nameEl.textContent = name;
      subEl.textContent = sub;
      overlay.classList.add('show');
    }

    function resumeAfterDelay() {
      setTimeout(() => {
        overlay.classList.remove('show');
        dotEl.style.background = 'var(--ok)';
        isPaused = false;
      }, 1500);
    }
  </script>
</body>
</html>
